[pytest]
# R161 / D-66：pytest 配置（此前项目根与 candidate/indpensim/v0.1/ 均无配置，
# 导致根路径解析依赖调用者 cwd，pytest 缓存落在多处）。
#
# 用法（推荐，在项目根执行）：
#   py -m pytest -q                      # 跑全部 13+1 个测试
#   py -m pytest candidate/indpensim/v0.1 -q
#
# 硬约束说明：
# - testpaths 固定为引擎包目录 ⇒ 不会被 tools/ 下 347 处 import pytest 的工具脚本误收集
#   （tools/ 下多为脚本而非测试函数，误收集会触发长耗时回放）。
# - rootdir 固定为项目根（由本文件位置自动确定），保证 data/processed/batches 的
#   相对路径在「从根执行」与「从包内执行」两种 cwd 下都能解析
#   （simulate.load_batch 已有双路径兜底，见 simulate.py:_DATA_DIR）。
# - 引擎测试需从包目录 import 同名模块（simulate / model / params 等），
#   故 pythonpath 显式加入包目录，等价于各测试文件内的 sys.path.insert。

testpaths = candidate/indpensim/v0.1

python_files = test_*.py
python_classes = Test*
python_functions = test_*

pythonpath =
    candidate/indpensim/v0.1

addopts =
    --strict-markers
    -p no:cacheprovider

# 标记登记（当前无自定义标记；此处占位以防 --strict-markers 报错）
markers =
    slow: 长耗时回放类测试（默认不参与常规闸门）

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
